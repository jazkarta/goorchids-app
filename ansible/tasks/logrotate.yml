- name: Rotate the Traefik log
  become: true
  ansible.builtin.copy:
    content: |
      /home/{{ goorchids_user }}/goorchids-app/var/log/traefik.log {
          daily
          maxsize 100M
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    dest: /etc/logrotate.d/goorchids-traefik
    owner: root
    group: root
    mode: "0644"
